# Active Vite workflow; the Jekyll filename is historical.
# Pages source is GitHub Actions; the github-pages environment permits main only.
# Publication stays manual: dispatch this workflow from main after approval.
# Pages serves the static Vite bundle; it cannot host an API/database service.
# Verified against https://vite.dev/guide/static-deploy.html#github-pages
# and https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

name: Deploy approved main build to GitHub Pages

'on':
  workflow_dispatch:
    inputs:
      allow_game_test_failure:
        description: 'Explicit release exception: publish despite failing game tests'
        required: true
        type: boolean
        default: false

# Grant each job only the permissions it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run game and service tests
        id: game-tests
        continue-on-error: ${{ inputs.allow_game_test_failure }}
        run: npm run test
      - name: Record the approved test exception
        if: ${{ steps.game-tests.outcome == 'failure' && inputs.allow_game_test_failure }}
        run: |
          echo '::warning::Game tests failed. Publishing under the explicitly selected human release exception.'
          echo '### Human-approved release exception' >> "$GITHUB_STEP_SUMMARY"
          echo 'Game tests failed; their complete output remains in the test step. This run explicitly permits publication despite those failures. Type, lint, helper and build checks remain mandatory.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test the local server helper
        run: python3 -m unittest discover -s tests/python -v
      - name: Build the repository-subpath site
        run: npm run build:pages
      - name: Read existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
